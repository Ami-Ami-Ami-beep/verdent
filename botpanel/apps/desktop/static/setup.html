<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>BotPanel – Einrichtung</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #09090b; color: #f4f4f5; font-family: "Segoe UI", system-ui, sans-serif; padding: 16px; }
      .card { width: 100%; max-width: 420px; background: #18181b; border: 1px solid #27272a; border-radius: 14px; padding: 28px; }
      h1 { margin: 0 0 6px; font-size: 22px; }
      p { margin: 0 0 20px; color: #a1a1aa; font-size: 14px; line-height: 1.5; }
      label { display: block; font-size: 13px; margin-bottom: 6px; }
      input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #3f3f46; background: #09090b; color: inherit; font-size: 14px; outline: none; }
      input:focus { border-color: #5865f2; }
      button { margin-top: 16px; width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #5865f2; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
      button:hover { background: #4752c4; }
      .error { color: #f87171; font-size: 13px; margin-top: 10px; min-height: 1em; }
    </style>
  </head>
  <body>
    <form class="card" id="form">
      <h1>Willkommen bei BotPanel</h1>
      <p>Gib die Adresse deines BotPanel-Servers ein, also die Adresse deiner Website, z. B. <code>panel.deine-domain.de</code>.</p>
      <label for="url">Server-Adresse</label>
      <input id="url" placeholder="https://panel.deine-domain.de" autofocus required />
      <button type="submit">Verbinden</button>
      <div class="error" id="error"></div>
    </form>
    <script>
      const params = new URLSearchParams(location.search);
      const input = document.getElementById("url");
      const error = document.getElementById("error");
      if (params.get("error") === "unreachable") {
        error.textContent = "Server " + (params.get("url") || "") + " ist nicht erreichbar.";
      }
      window.botpanelDesktop.getServerUrl().then((u) => { if (u && !input.value) input.value = u; });
      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        error.textContent = "";
        const res = await window.botpanelDesktop.setServerUrl(input.value);
        if (!res.ok) error.textContent = res.error;
      });
    </script>
  </body>
</html>
